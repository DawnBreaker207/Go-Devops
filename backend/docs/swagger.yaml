basePath: /api/v1
definitions:
  dto.BoxOfficeDayResponse:
    properties:
      count:
        type: integer
      date:
        example: "2026-09-14"
        type: string
      total:
        type: integer
    type: object
  dto.ChangePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        example: newsecret123
        maxLength: 72
        minLength: 6
        type: string
    required:
    - current_password
    - new_password
    type: object
  dto.CounterSellRequest:
    properties:
      customer_name:
        maxLength: 255
        type: string
      customer_phone:
        maxLength: 20
        type: string
      seat_ids:
        items:
          type: string
        minItems: 1
        type: array
      show_id:
        type: string
    required:
    - seat_ids
    - show_id
    type: object
  dto.CreateUserRequest:
    properties:
      email:
        example: staff1@cinema.local
        maxLength: 255
        type: string
      full_name:
        maxLength: 255
        minLength: 2
        type: string
      password:
        maxLength: 72
        minLength: 6
        type: string
      role:
        enum:
        - staff
        - admin
        example: staff
        type: string
    required:
    - email
    - full_name
    - password
    - role
    type: object
  dto.DailyAggregateResponse:
    properties:
      breakdown:
        additionalProperties: {}
        type: object
      capacity:
        type: integer
      occupancy_rate:
        type: number
      report_date:
        type: string
      seats_sold:
        type: integer
      tickets_sold:
        type: integer
      total_revenue:
        type: integer
      updated_at:
        type: string
    type: object
  dto.DailyReportResponse:
    properties:
      days:
        items:
          $ref: '#/definitions/dto.DailyAggregateResponse'
        type: array
      from:
        example: "2026-09-08"
        type: string
      tickets_sold:
        type: integer
      to:
        example: "2026-09-14"
        type: string
      total_revenue:
        type: integer
    type: object
  dto.ForgotPasswordRequest:
    properties:
      email:
        example: admin@cinema.local
        maxLength: 255
        type: string
    required:
    - email
    type: object
  dto.HallPriceResponse:
    properties:
      price:
        type: integer
      seat_type:
        type: string
    type: object
  dto.HallRequest:
    properties:
      gaps:
        example:
        - '["D5"'
        - '"D6"]'
        items:
          type: string
        maxItems: 200
        type: array
      name:
        example: Phong 2
        maxLength: 255
        minLength: 1
        type: string
      prices:
        additionalProperties:
          format: int64
          type: integer
        description: Must hold a positive price for each of the 4 seat types.
        example:
          couple: 160000
          recliner: 130000
          standard: 70000
          vip: 100000
        type: object
      rows:
        example: 8
        maximum: 50
        minimum: 1
        type: integer
      seat_types:
        additionalProperties:
          items:
            type: string
          type: array
        description: 'Optional: rows not listed are standard.'
        type: object
      seats_per_row:
        example: 12
        maximum: 50
        minimum: 1
        type: integer
      spans:
        description: |-
          Anchors of 2-column seats, e.g. ["D3"] makes one seat spanning D3-D4; the
          neighbor column keeps no seat of its own.
        example:
        - '["D3"]'
        items:
          type: string
        maxItems: 100
        type: array
    required:
    - name
    - prices
    - rows
    - seats_per_row
    type: object
  dto.HallResponse:
    properties:
      created_at:
        type: string
      gaps:
        items:
          type: string
        type: array
      id:
        type: string
      name:
        type: string
      rows:
        type: integer
      seat_types:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
      seats_per_row:
        type: integer
      updated_at:
        type: string
    type: object
  dto.HeldSeat:
    properties:
      col_number:
        type: integer
      label:
        type: string
      price:
        type: integer
      row_label:
        type: string
      seat_type:
        type: string
      showtime_seat_id:
        type: string
    type: object
  dto.HoldRequest:
    properties:
      idempotency_key:
        maxLength: 128
        minLength: 1
        type: string
      seat_ids:
        items:
          type: string
        minItems: 1
        type: array
      show_id:
        type: string
    required:
    - seat_ids
    - show_id
    type: object
  dto.HoldResponse:
    properties:
      booking_id:
        type: string
      expires_at:
        type: string
      replaced_booking_id:
        type: string
      seats:
        items:
          $ref: '#/definitions/dto.HeldSeat'
        type: array
      showtime_id:
        type: string
      total_amount:
        type: integer
    type: object
  dto.LoginRequest:
    properties:
      email:
        example: admin@cinema.local
        type: string
      password:
        example: secret123
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        example: 900
        type: integer
      refresh_token:
        type: string
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.LogoutRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.MovieRequest:
    properties:
      age_rating:
        description: AgeRating is Vietnamese film classification; empty defaults to
          P.
        enum:
        - P
        - K
        - T13
        - T16
        - T18
        example: T18
        type: string
      cast:
        example: Leonardo DiCaprio, Joseph Gordon-Levitt
        maxLength: 2000
        type: string
      description:
        maxLength: 5000
        type: string
      director:
        example: Christopher Nolan
        maxLength: 255
        type: string
      duration:
        example: 148
        maximum: 600
        minimum: 1
        type: integer
      genre:
        example: Sci-Fi
        maxLength: 100
        type: string
      poster_url:
        maxLength: 512
        type: string
      release_date:
        example: "2010-07-16"
        type: string
      status:
        enum:
        - draft
        - showing
        - ended
        example: showing
        type: string
      title:
        example: Inception
        maxLength: 255
        minLength: 1
        type: string
      trailer_url:
        example: https://www.youtube.com/watch?v=YoHD9XEInc0
        maxLength: 512
        type: string
    required:
    - director
    - duration
    - genre
    - release_date
    - status
    - title
    type: object
  dto.MovieResponse:
    properties:
      age_rating:
        type: string
      cast:
        type: string
      created_at:
        type: string
      description:
        type: string
      director:
        type: string
      duration:
        type: integer
      genre:
        type: string
      id:
        type: string
      poster_url:
        type: string
      release_date:
        example: "2010-07-16"
        type: string
      status:
        type: string
      title:
        type: string
      trailer_url:
        type: string
      updated_at:
        type: string
    type: object
  dto.OrderDetailResponse:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      paid_at:
        type: string
      payment:
        $ref: '#/definitions/dto.PaymentSummary'
      showtime:
        $ref: '#/definitions/dto.OrderShowtime'
      showtime_id:
        type: string
      status:
        type: string
      status_reason:
        type: string
      tickets:
        items:
          $ref: '#/definitions/dto.TicketResponse'
        type: array
      total_amount:
        type: integer
    type: object
  dto.OrderShowtime:
    properties:
      age_rating:
        type: string
      end_at:
        type: string
      ended:
        type: boolean
      hall_id:
        type: string
      hall_name:
        type: string
      movie_id:
        type: string
      movie_title:
        type: string
      start_at:
        type: string
      started:
        type: boolean
    type: object
  dto.OrderStatusResponse:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      paid_at:
        type: string
      payment:
        $ref: '#/definitions/dto.PaymentSummary'
      showtime:
        $ref: '#/definitions/dto.OrderShowtime'
      showtime_id:
        type: string
      status:
        type: string
      status_reason:
        type: string
      total_amount:
        type: integer
    type: object
  dto.PayRequest:
    properties:
      provider:
        example: mock
        maxLength: 32
        type: string
    type: object
  dto.PayResponse:
    properties:
      expires_at:
        type: string
      payment_id:
        type: string
      provider:
        type: string
      redirect_url:
        type: string
      txn_ref:
        type: string
    type: object
  dto.PaymentProviderResponse:
    properties:
      default:
        type: boolean
      display_name:
        type: string
      name:
        example: mock
        type: string
    type: object
  dto.PaymentReturnResponse:
    properties:
      booking_id:
        type: string
      booking_reason:
        type: string
      booking_status:
        type: string
      payment_id:
        type: string
      payment_status:
        type: string
    type: object
  dto.PaymentSummary:
    properties:
      amount:
        type: integer
      id:
        type: string
      paid_amount:
        type: integer
      paid_at:
        type: string
      provider:
        type: string
      refunded_at:
        type: string
      status:
        type: string
      status_reason:
        type: string
      txn_ref:
        type: string
    type: object
  dto.PriceRequest:
    properties:
      prices:
        additionalProperties:
          format: int64
          type: integer
        example:
          standard: 80000
          vip: 120000
        type: object
    required:
    - prices
    type: object
  dto.RedeemRequestBody:
    properties:
      showtime_id:
        type: string
    required:
    - showtime_id
    type: object
  dto.RedeemResponse:
    properties:
      age_rating:
        type: string
      checkin_closes_at:
        type: string
      checkin_opens_at:
        description: Check-in window, so the gate can tell when the doors open or
          closed.
        type: string
      hall_name:
        type: string
      movie_title:
        type: string
      seat_label:
        type: string
      showtime_id:
        type: string
      start_at:
        type: string
      status:
        type: string
      ticket_id:
        type: string
    type: object
  dto.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.RegisterRequest:
    properties:
      email:
        example: admin@cinema.local
        maxLength: 255
        type: string
      full_name:
        example: Nguyen Van A
        maxLength: 255
        minLength: 2
        type: string
      password:
        example: secret123
        maxLength: 72
        minLength: 6
        type: string
    required:
    - email
    - full_name
    - password
    type: object
  dto.ResetPasswordRequest:
    properties:
      new_password:
        example: newsecret123
        maxLength: 72
        minLength: 6
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  dto.SeatMapResponse:
    properties:
      age_rating:
        type: string
      end_at:
        type: string
      hall_id:
        type: string
      hall_name:
        type: string
      movie_id:
        type: string
      movie_title:
        type: string
      prices:
        additionalProperties:
          format: int64
          type: integer
        type: object
      seats:
        items:
          $ref: '#/definitions/dto.SeatMapSeat'
        type: array
      showtime_id:
        type: string
      start_at:
        type: string
      status:
        type: string
    type: object
  dto.SeatMapSeat:
    properties:
      col_number:
        type: integer
      col_span:
        type: integer
      id:
        type: string
      is_gap:
        type: boolean
      label:
        type: string
      price:
        type: integer
      row_label:
        type: string
      seat_type:
        type: string
      showtime_seat_id:
        type: string
      status:
        type: string
    type: object
  dto.SeatResponse:
    properties:
      col_number:
        type: integer
      col_span:
        type: integer
      hall_id:
        type: string
      id:
        type: string
      is_gap:
        type: boolean
      label:
        type: string
      row_label:
        type: string
      seat_type:
        type: string
    type: object
  dto.SeatUpdateRequest:
    properties:
      is_gap:
        description: Omitted keeps the current value.
        type: boolean
      seat_type:
        enum:
        - standard
        - vip
        - couple
        - recliner
        type: string
    type: object
  dto.ShowtimeListItem:
    properties:
      age_rating:
        type: string
      end_at:
        type: string
      from_price:
        type: integer
      hall_id:
        type: string
      hall_name:
        type: string
      id:
        type: string
      movie_id:
        type: string
      movie_title:
        type: string
      start_at:
        type: string
      status:
        type: string
    type: object
  dto.ShowtimeRequest:
    properties:
      hall_id:
        type: string
      movie_id:
        example: 10000000-0000-0000-0000-000000000001
        type: string
      start_at:
        example: "2026-09-15T19:00:00+07:00"
        type: string
      status:
        description: Status is optional; omitted keeps the current value on update.
        enum:
        - open
        - closed
        type: string
    required:
    - hall_id
    - movie_id
    - start_at
    type: object
  dto.ShowtimeResponse:
    properties:
      age_rating:
        type: string
      created_at:
        type: string
      end_at:
        type: string
      hall_id:
        type: string
      hall_name:
        type: string
      id:
        type: string
      movie_id:
        type: string
      movie_title:
        type: string
      start_at:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.StaffBoardResponse:
    properties:
      date:
        example: "2026-09-14"
        type: string
      showtimes:
        items:
          $ref: '#/definitions/dto.StaffShowtimeResponse'
        type: array
    type: object
  dto.StaffShowtimeResponse:
    properties:
      available:
        type: integer
      capacity:
        type: integer
      checked_in:
        type: integer
      end_at:
        type: string
      hall_name:
        type: string
      held:
        type: integer
      id:
        type: string
      movie_title:
        type: string
      sold:
        type: integer
      start_at:
        type: string
      status:
        type: string
    type: object
  dto.StaffTicketResponse:
    properties:
      booking_id:
        type: string
      id:
        type: string
      seat_label:
        type: string
      seat_type:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.TicketResponse:
    properties:
      code:
        type: string
      id:
        type: string
      price:
        type: integer
      seat_label:
        type: string
      seat_type:
        type: string
      showtime_seat_id:
        type: string
      status:
        type: string
    type: object
  dto.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        example: 900
        type: integer
      refresh_token:
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  dto.UpdateProfileRequest:
    properties:
      full_name:
        example: Nguyen Van A
        maxLength: 255
        minLength: 2
        type: string
      phone:
        example: "0901234567"
        maxLength: 20
        type: string
    required:
    - full_name
    type: object
  dto.UpdateUserRequest:
    properties:
      active:
        type: boolean
      role:
        enum:
        - customer
        - staff
        - admin
        example: staff
        type: string
    type: object
  dto.UploadResponse:
    properties:
      content_type:
        type: string
      size:
        type: integer
      url:
        type: string
    type: object
  dto.UserResponse:
    properties:
      active:
        type: boolean
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      phone:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
  handlers.HealthStatus:
    properties:
      database:
        example: up
        type: string
      service:
        example: BackEnd-CP
        type: string
      status:
        example: ok
        type: string
    type: object
  response.Body:
    properties:
      code:
        example: 0
        type: integer
      data: {}
      details:
        additionalProperties:
          type: string
        type: object
      message:
        example: success
        type: string
    type: object
  response.Meta:
    properties:
      page:
        example: 1
        type: integer
      page_size:
        example: 10
        type: integer
      total:
        example: 42
        type: integer
      total_pages:
        example: 5
        type: integer
    type: object
  response.Paged:
    properties:
      items: {}
      meta:
        $ref: '#/definitions/response.Meta'
    type: object
info:
  contact: {}
  description: API for the Cinema Project box-office system.
  title: BackEnd-CP API
  version: "1.0"
paths:
  /admin/batch/jobs:
    get:
      parameters:
      - description: Page
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      - description: Filter by job_name
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/response.Paged'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
      summary: Batch job run history
      tags:
      - batch
  /admin/batch/jobs/{name}/run:
    post:
      consumes:
      - application/json
      description: Answers 202 once the run is registered; follow its status in /admin/batch/jobs.
      parameters:
      - description: Job name (e.g. closeDay, sweepExpiredHolds)
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Body'
      summary: Start a job now, in the background
      tags:
      - batch
  /admin/halls:
    get:
      parameters:
      - default: 1
        description: Current page
        in: query
        name: page
        type: integer
      - default: 10
        description: Records per page
        in: query
        name: page_size
        type: integer
      - description: Search by hall name
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/response.Paged'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/dto.HallResponse'
                        type: array
                    type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: List halls (paginated)
      tags:
      - halls
    post:
      consumes:
      - application/json
      parameters:
      - description: Hall layout
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.HallRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.HallResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Create a hall and generate its seat grid
      tags:
      - halls
  /admin/halls/{id}:
    get:
      parameters:
      - description: Hall ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.HallResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Get hall details
      tags:
      - halls
  /admin/halls/{id}/prices:
    get:
      parameters:
      - description: Hall ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.HallPriceResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Get the prices of a hall
      tags:
      - halls
    put:
      consumes:
      - application/json
      parameters:
      - description: Hall ID
        in: path
        name: id
        required: true
        type: string
      - description: Price per seat type
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.PriceRequest'
      produces:
