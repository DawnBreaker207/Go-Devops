info:
  contact: {}
  description: API for the Cinema Project box-office system.
  title: BackEnd-CP API
  version: "1.0"
paths:
  /admin/audit-logs:
    get:
      description: |-
        Every audited event, newest first. booking_id ties together the
        whole lifecycle of one order (hold/pay/webhook/refund/redeem)
        even though they touch different resource_type/resource_id.
      parameters:
      - description: Page
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      - description: Exact action, e.g. orders.pay
        in: query
        name: action
        type: string
      - description: e.g. booking, payment, ticket, movie, hall
        in: query
        name: resource_type
        type: string
      - description: Exact resource id
        in: query
        name: resource_id
        type: string
      - description: Every event of one order's lifecycle
        in: query
        name: booking_id
        type: string
      - description: Who did it
        in: query
        name: actor_id
        type: string
      - description: success | failure
        in: query
        name: outcome
        type: string
      - description: YYYY-MM-DD, inclusive
        in: query
        name: from
        type: string
      - description: YYYY-MM-DD, inclusive
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_pkg_response.Body'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_pkg_response.Paged'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.AuditLogResponse'
                        type: array
                    type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_pkg_response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: List audit log entries (admin)
      tags:
      - admin-audit
  /admin/batch/jobs:
    get:
      parameters:
      - description: Page
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      - description: Filter by job_name
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_pkg_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_pkg_response.Paged'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_pkg_response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_pkg_response.Body'
      summary: Batch job run history
      tags:
      - batch
  /admin/batch/jobs/{name}/run:
    post:
      consumes:
      - application/json
      description: Answers 202 once the run is registered; follow its status in /admin/batch/jobs.
      parameters:
      - description: Job name (e.g. closeDay, sweepExpiredHolds)
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_pkg_response.Body'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_pkg_response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_pkg_response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_pkg_response.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_pkg_response.Body'
      summary: Start a job now, in the background
      tags:
      - batch
  /admin/concessions:
    get:
      description: Unlike the public GET /combos this is paged and INCLUDES inactive
        products, so an operator can put one back on sale.
      parameters:
      - default: 1
        description: Page
        in: query
        name: page
        type: integer
      - default: 10
        description: Page size
        in: query
        name: page_size
        type: integer
      - description: Match name or description
        in: query
        name: search
        type: string
      - description: Filter on sale / off sale; omit for both
        in: query
        name: active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_pkg_response.Body'
            - properties:
