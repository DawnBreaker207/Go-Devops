          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: List the current user's orders
      tags:
      - orders
  /orders/{id}:
    get:
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.OrderDetailResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Get the e-ticket of one order (reconciled, with ticket codes)
      tags:
      - orders
  /orders/{id}/cancel:
    post:
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.OrderStatusResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Release an unpaid hold now
      tags:
      - orders
  /orders/{id}/confirm:
    post:
      description: Reconciles with the provider, then confirms (issues tickets) or
        reports the refund. Idempotent.
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.OrderDetailResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Settle a paid booking
      tags:
      - orders
  /orders/{id}/pay:
    post:
      consumes:
      - application/json
      description: Returns the provider checkout URL. The amount comes from the booking.
        Paying again with the same provider returns the open checkout; another provider
        opens a new attempt.
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: string
      - description: Provider from GET /payments/providers (empty = default)
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.PayRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.PayResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Body'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Start payment for a booking with a chosen provider
      tags:
      - orders
  /orders/{id}/status:
    get:
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.OrderStatusResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Get booking status (reconciles with the provider)
      tags:
      - orders
  /orders/hold:
    post:
      consumes:
      - application/json
      description: Reserves seats for 10 minutes and locks their price. A second hold
        of the same user/show replaces the first without extending its expiry.
      parameters:
      - description: Seats to hold
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.HoldRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.HoldResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Hold seats for a showtime
      tags:
      - orders
  /payments/{provider}/ipn:
    post:
      description: 'Outside JWT: the provider signature is the credential. GET or
        POST depending on the gateway; the answer follows the gateway''s own contract.'
      parameters:
      - description: Provider name, e.g. mock
        in: path
        name: provider
        required: true
        type: string
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
        "404":
          description: Not Found
      summary: Provider IPN callback
      tags:
      - payments
  /payments/{provider}/return:
    get:
      description: Verifies the redirect, reconciles with the provider, then redirects
        to payment.return_redirect_url (or answers JSON when unset).
      parameters:
      - description: Provider name, e.g. mock
        in: path
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.PaymentReturnResponse'
              type: object
        "303":
          description: See Other
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      summary: Browser return from a provider checkout
      tags:
      - payments
  /payments/providers:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.PaymentProviderResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: List the payment providers a customer can choose
      tags:
      - payments
  /shows/{id}/seats:
    get:
      parameters:
      - description: Showtime ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.SeatMapResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Get the seat grid of a showtime with prices
      tags:
      - showtimes
  /showtimes:
    get:
      description: Hides draft/ended movies, started showtimes and halls without full
        prices. A day without showtimes returns an empty list.
      parameters:
      - description: Date (YYYY-MM-DD), default today
        in: query
        name: date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ShowtimeListItem'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Showtimes on sale for a date, all movies
      tags:
      - showtimes
  /staff/boxoffice/day:
    get:
      parameters:
      - description: YYYY-MM-DD, default today
        in: query
        name: date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.BoxOfficeDayResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Counter sales of a day (close-day report)
      tags:
      - staff
  /staff/dashboard:
    get:
      parameters:
      - description: Local date YYYY-MM-DD (default today)
        in: query
        name: date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.StaffBoardResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: 'Staff board: showtimes of a day with seats sold / held / checked in'
      tags:
      - staff
  /staff/orders:
    post:
      consumes:
      - application/json
      description: 'Sells tickets for cash to someone without an account: booking
        is confirmed immediately, no email.'
      parameters:
      - description: Showtime, seats and walk-in details
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.CounterSellRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.OrderDetailResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: seat already taken
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Walk-in sale at the counter
      tags:
      - staff
  /staff/showtimes/{id}/tickets:
    get:
      parameters:
      - description: Showtime ID
        in: path
        name: id
        required: true
        type: string
      - description: issued | redeemed
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.StaffTicketResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: 'Tickets of a showtime (status=issued: still waiting at the gate)'
      tags:
      - staff
  /tickets/{id}/redeem:
    post:
      consumes:
      - application/json
      description: 'id is the ticket id or the code read from the QR. Verdict: ok
        | used | wrong_show | not_found | too_early | closed (outside the check-in
        window, returned as checkin_opens_at / checkin_closes_at).'
      parameters:
      - description: Ticket ID or QR code
        in: path
        name: id
        required: true
        type: string
      - description: Showtime at the gate
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.RedeemRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.RedeemResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Check a ticket in at the gate (staff)
      tags:
      - tickets
  /users/me:
    delete:
      description: 409 while a confirmed ticket is still to come; then the account
        is scrubbed and sessions revoked.
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: account still holds confirmed tickets
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Delete own account (right to erasure)
      tags:
      - users
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Current logged-in account info
      tags:
      - users
    put:
      consumes:
      - application/json
      parameters:
      - description: New full name and phone
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Update own full name and phone
      tags:
      - users
  /users/me/password:
    put:
      consumes:
      - application/json
      description: Revokes all other sessions; the current one gets a fresh token
        pair.
      parameters:
      - description: Current and new password
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.TokenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: wrong current password
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: Change the current password
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: 'Header format: Bearer <access_token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
