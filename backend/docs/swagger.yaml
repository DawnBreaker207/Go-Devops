basePath: /api/v1
definitions:
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.AdminAlertsResponse:
    properties:
      failed_jobs:
        items:
          $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.FailedJobAlert'
        type: array
      given_up_emails:
        items:
          $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.GivenUpEmailAlert'
        type: array
      stuck_refunds:
        items:
          $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.StuckRefundAlert'
        type: array
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.AdminOrderListItem:
    properties:
      created_at:
        type: string
      customer:
        $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.OrderCustomer'
      discount_amount:
        type: integer
      expires_at:
        type: string
      id:
        type: string
      paid_at:
        type: string
      payable_amount:
        type: integer
      payment:
        $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.PaymentSummary'
      seats:
        type: integer
      showtime:
        $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.OrderShowtime'
      showtime_id:
        type: string
      sold_via:
        type: string
      status:
        type: string
      status_reason:
        type: string
      total_amount:
        description: |-
          TotalAmount is the SEAT SUBTOTAL, before any discount. The amount the
          customer actually owes is PayableAmount below - a screen that renders
          total_amount as "amount due" is showing the wrong number on a discounted
          order. Both are always present (no omitempty) so the two can never be
          confused by one of them being absent.
        type: integer
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.AdminOverviewResponse:
    properties:
      alerts:
        $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.AdminAlertsResponse'
      last_7_days:
        items:
          $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.DailyAggregateResponse'
        type: array
      today:
        $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.DailyAggregateResponse'
      upcoming_showtimes:
        items:
          $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.StaffShowtimeResponse'
        type: array
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.AdminStatsResponse:
    properties:
      bookings:
        type: integer
      movies:
        type: integer
      showtimes:
        type: integer
      users:
        type: integer
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.ApplyDiscountRequest:
    properties:
      code:
        example: WELCOME10
        maxLength: 32
        minLength: 1
        type: string
    required:
    - code
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.AuditLogResponse:
    properties:
      action:
        type: string
      actor_id:
        type: string
      actor_role:
        type: string
      after_json:
        additionalProperties: {}
        type: object
      before_json:
        additionalProperties: {}
        type: object
      booking_id:
        type: string
      created_at:
        type: string
      error_message:
        type: string
      id:
        type: string
      ip:
        type: string
      outcome:
        type: string
      resource_id:
        type: string
      resource_type:
        type: string
      user_agent:
        type: string
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.BoxOfficeDayResponse:
    properties:
      count:
        type: integer
      date:
        example: "2026-09-14"
        type: string
      total:
        type: integer
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.BreakdownDay:
    properties:
      date:
        example: "2026-09-14"
        type: string
      revenue:
        type: integer
      tickets:
        type: integer
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.BreakdownHall:
    properties:
      hall_id:
        type: string
      name:
        type: string
      revenue:
        type: integer
      tickets:
        type: integer
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.BreakdownMovie:
    properties:
      movie_id:
        type: string
      revenue:
        type: integer
      tickets:
        type: integer
      title:
        type: string
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.BreakdownProvider:
    properties:
      count:
        type: integer
      provider:
        type: string
      revenue:
        type: integer
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.BreakdownResponse:
    properties:
      days:
        items:
          $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.BreakdownDay'
        type: array
      from:
        example: "2026-09-08"
        type: string
      halls:
        items:
          $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.BreakdownHall'
        type: array
      movies:
        items:
          $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.BreakdownMovie'
        type: array
      providers:
        items:
          $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.BreakdownProvider'
        type: array
      tickets_sold:
        type: integer
      to:
        example: "2026-09-14"
        type: string
      total_revenue:
        type: integer
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.BulkSeatUpdateRequest:
    properties:
      changes:
        items:
          $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.SeatChange'
        maxItems: 50
        minItems: 1
        type: array
    required:
    - changes
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.ChangePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        example: newsecret123
        maxLength: 72
        minLength: 6
        type: string
    required:
    - current_password
    - new_password
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.CloneHallRequest:
    properties:
      copy_prices:
        type: boolean
      name:
        example: Phong 3
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.ComboOrderItemRequest:
    properties:
      combo_id:
        type: string
      quantity:
        maximum: 20
        minimum: 1
        type: integer
    required:
    - combo_id
    - quantity
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.ComboOrderItemResponse:
    properties:
      combo_id:
        type: string
      combo_name:
        type: string
      quantity:
        type: integer
      subtotal:
        type: integer
      unit_price:
        type: integer
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.ComboOrderResponse:
    properties:
      booking_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.ComboOrderItemResponse'
        type: array
      status:
        type: string
      total:
        type: integer
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.ComboResponse:
    properties:
      active:
        type: boolean
      description:
        type: string
      id:
        type: string
      image_url:
        type: string
      name:
        type: string
      price:
        type: integer
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.CounterSellRequest:
    properties:
      customer_name:
        maxLength: 255
        type: string
      customer_phone:
        maxLength: 20
        type: string
      seat_ids:
        items:
          type: string
        minItems: 1
        type: array
      show_id:
        type: string
    required:
    - seat_ids
    - show_id
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.CreateComboOrderRequest:
    properties:
      booking_id:
        type: string
      items:
        items:
          $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.ComboOrderItemRequest'
        minItems: 1
        type: array
    required:
    - items
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.CreateComboRequest:
    properties:
      active:
        description: |-
          Active defaults to TRUE when omitted: a product created from the admin
          screen is normally meant to go on sale immediately.
        type: boolean
      description:
        maxLength: 2000
        type: string
      image_url:
        maxLength: 512
        type: string
      name:
        example: Combo 1 - Bap ngot + 2 Pepsi
        maxLength: 255
        minLength: 2
        type: string
      price:
        example: 89000
        minimum: 0
        type: integer
    required:
    - name
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.CreateDiscountRequest:
    properties:
      active:
        description: Omitted defaults to TRUE.
        type: boolean
      code:
        example: WELCOME10
        maxLength: 32
        minLength: 3
        type: string
      description:
        maxLength: 2000
        type: string
      ends_at:
        type: string
      kind:
        enum:
        - percent
        - amount
        example: percent
        type: string
      max_discount:
        minimum: 1
        type: integer
      max_uses:
        minimum: 1
        type: integer
      min_order:
        minimum: 0
        type: integer
      starts_at:
        type: string
      value:
        example: 10
        minimum: 1
        type: integer
    required:
    - code
    - kind
    - value
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.CreateUserRequest:
    properties:
      email:
        example: staff1@cinema.local
        maxLength: 255
        type: string
      full_name:
        maxLength: 255
        minLength: 2
        type: string
      password:
        maxLength: 72
        minLength: 6
        type: string
      role:
        enum:
        - staff
        - admin
        example: staff
        type: string
    required:
    - email
    - full_name
    - password
    - role
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.DailyAggregateResponse:
    properties:
      breakdown:
        additionalProperties: {}
        type: object
      capacity:
        type: integer
      occupancy_rate:
        type: number
      report_date:
        type: string
      seats_sold:
        type: integer
      tickets_sold:
        type: integer
      total_revenue:
        type: integer
      updated_at:
        type: string
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.DailyReportResponse:
    properties:
      days:
        items:
          $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.DailyAggregateResponse'
        type: array
      from:
        example: "2026-09-08"
        type: string
      tickets_sold:
        type: integer
      to:
        example: "2026-09-14"
        type: string
      total_revenue:
        type: integer
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.DeleteAccountRequest:
    properties:
      password:
        example: secret123
        type: string
    required:
    - password
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.DiscountAppliedResponse:
    properties:
      booking_id:
        type: string
      code:
        type: string
      discount:
        type: integer
      payable:
        type: integer
      subtotal:
        type: integer
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.DiscountCodeResponse:
    properties:
      active:
        type: boolean
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      ends_at:
        type: string
      id:
        type: string
      kind:
        type: string
      max_discount:
        type: integer
      max_uses:
        type: integer
      min_order:
        type: integer
      starts_at:
        type: string
      used_count:
        type: integer
      value:
        type: integer
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.FailedJobAlert:
    properties:
      error_message:
        type: string
      id:
        type: string
      job_name:
        type: string
      started_at:
        type: string
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.ForgotPasswordRequest:
    properties:
      email:
        example: admin@cinema.local
        maxLength: 255
        type: string
    required:
    - email
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.GivenUpEmailAlert:
    properties:
      attempts:
        type: integer
      booking_id:
        type: string
      created_at:
        type: string
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.HallPriceResponse:
    properties:
      price:
        type: integer
      seat_type:
        type: string
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.HallRequest:
    properties:
      aisle_after_cols:
        description: Column numbers after which there is a vertical aisle, display
          only.
        example:
        - 4
        items:
          type: integer
        maxItems: 49
        type: array
      gaps:
        example:
        - '["D5"'
        - '"D6"]'
        items:
          type: string
        maxItems: 200
        type: array
      name:
        example: Phong 2
        maxLength: 255
        minLength: 1
        type: string
      prices:
        additionalProperties:
          format: int64
          type: integer
        description: Must hold a positive price for each of the 4 seat types.
        example:
          couple: 160000
          recliner: 130000
          standard: 70000
          vip: 100000
        type: object
      rows:
        example: 8
        maximum: 50
        minimum: 1
        type: integer
      screen_position:
        enum:
        - front
        - back
        example: front
        type: string
      seat_types:
        additionalProperties:
          items:
            type: string
          type: array
        description: 'Optional: rows not listed are standard.'
        type: object
      seats_per_row:
        example: 12
        maximum: 50
        minimum: 1
        type: integer
      spans:
        description: Anchors of 2-column seats, e.g. ["D3"] spans D3-D4; the neighbor
          keeps no seat.
        example:
        - '["D3"]'
        items:
          type: string
        maxItems: 100
        type: array
      template:
        enum:
        - small
        - medium
        - large
        example: medium
        type: string
    required:
    - name
    - prices
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.HallResponse:
    properties:
      active:
        type: boolean
      aisle_after_cols:
        items:
          type: integer
        type: array
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      rows:
        type: integer
      screen_position:
        type: string
      seats_per_row:
        type: integer
      updated_at:
        type: string
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.HallTemplateResponse:
    properties:
      name:
        type: string
      rows:
        type: integer
      seat_count:
        type: integer
      seat_count_by_type:
        additionalProperties:
          type: integer
        type: object
      seats_per_row:
        type: integer
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.HeldSeat:
    properties:
      col_number:
        type: integer
      label:
        type: string
      price:
        type: integer
      row_label:
        type: string
      seat_type:
        type: string
      showtime_seat_id:
        type: string
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.HoldRequest:
    properties:
      idempotency_key:
        maxLength: 128
        minLength: 1
        type: string
      seat_ids:
        items:
          type: string
        minItems: 1
        type: array
      show_id:
        type: string
    required:
    - seat_ids
    - show_id
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.HoldResponse:
    properties:
      booking_id:
        type: string
      expires_at:
        type: string
      replaced_booking_id:
        type: string
      seats:
        items:
          $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.HeldSeat'
        type: array
      showtime_id:
        type: string
      total_amount:
        type: integer
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.InitRequest:
    properties:
      show_id:
        type: string
    required:
    - show_id
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.InitResponse:
    properties:
      booking_id:
        type: string
      expires_at:
        type: string
      reused:
        type: boolean
      showtime_id:
        type: string
      ttl_seconds:
        description: TTLSeconds lets the client run its ticker without clock math.
        type: integer
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.LoginRequest:
    properties:
      device_id:
        description: |-
          DeviceID is generated and kept by the frontend so the resulting session can
          later be listed and individually signed out from /users/me/sessions.
        example: web-3f0c9b6e
        maxLength: 255
        type: string
      email:
        example: admin@cinema.local
        type: string
      password:
        example: secret123
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        example: 900
        type: integer
      refresh_token:
        type: string
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.UserResponse'
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.LogoutRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.MergeSeatsRequest:
    properties:
      left_label:
        example: D3
        maxLength: 8
        type: string
      right_label:
        example: D4
        maxLength: 8
        type: string
    required:
    - left_label
    - right_label
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.MovieRequest:
    properties:
      age_rating:
        description: AgeRating is Vietnamese film classification; empty defaults to
          P.
        enum:
        - P
        - K
        - T13
        - T16
        - T18
        example: T18
        type: string
      cast:
        example: Leonardo DiCaprio, Joseph Gordon-Levitt
        maxLength: 2000
        type: string
      description:
        maxLength: 5000
        type: string
      director:
        example: Christopher Nolan
        maxLength: 255
        type: string
      duration:
        example: 148
        maximum: 600
        minimum: 1
        type: integer
      genre:
        example: Sci-Fi
        maxLength: 100
        type: string
      poster_url:
        maxLength: 512
        type: string
      release_date:
        example: "2010-07-16"
        type: string
      status:
        enum:
        - draft
        - coming_soon
        - showing
        - ended
        example: showing
        type: string
      title:
        example: Inception
        maxLength: 255
        minLength: 1
        type: string
      trailer_url:
        example: https://www.youtube.com/watch?v=YoHD9XEInc0
        maxLength: 512
        type: string
    required:
    - director
    - duration
    - genre
    - release_date
    - status
    - title
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.MovieResponse:
    properties:
      age_rating:
        type: string
      cast:
        type: string
      created_at:
        type: string
      description:
        type: string
      director:
        type: string
      duration:
        type: integer
      genre:
        type: string
      id:
        type: string
      poster_url:
        type: string
      release_date:
        example: "2010-07-16"
        type: string
      status:
        type: string
      title:
        type: string
      trailer_url:
        type: string
      updated_at:
        type: string
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.NotificationPreferenceResponse:
    properties:
      booking_reminders:
        type: boolean
      promo_offers:
        type: boolean
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.OrderCustomer:
    properties:
      email:
        type: string
      full_name:
        type: string
      phone:
        type: string
      user_id:
        type: string
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.OrderDetailResponse:
    properties:
      created_at:
        type: string
      discount_amount:
        type: integer
      expires_at:
        type: string
      id:
        type: string
      paid_at:
        type: string
      payable_amount:
        type: integer
      payment:
        $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.PaymentSummary'
      showtime:
        $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.OrderShowtime'
      showtime_id:
        type: string
      status:
        type: string
      status_reason:
        type: string
      tickets:
        items:
          $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.TicketResponse'
        type: array
      total_amount:
        description: |-
          TotalAmount is the SEAT SUBTOTAL, before any discount. The amount the
          customer actually owes is PayableAmount below - a screen that renders
          total_amount as "amount due" is showing the wrong number on a discounted
          order. Both are always present (no omitempty) so the two can never be
          confused by one of them being absent.
        type: integer
    type: object
  github_com_Cinema-Project-Juann_BackEnd-CP_internal_dto.OrderShowtime:
    properties:
      age_rating:
        type: string
      end_at:
        type: string
      ended:
        type: boolean
      hall_id:
        type: string
      hall_name:
        type: string
      movie_id:
        type: string
      movie_title:
        type: string
      start_at:
        type: string
