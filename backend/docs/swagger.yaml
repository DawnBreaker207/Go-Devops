          description: Not Found
          schema:
            $ref: '#/definitions/github_com_Cinema-Project-Juann_BackEnd-CP_pkg_response.Body'
      security:
      - BearerAuth: []
      summary: Current logged-in account info
      tags:
      - users
    put:
      consumes:
      - application/json
      parameters:
      - description: New full name and phone
        in: body
        name: payload
        required: true
