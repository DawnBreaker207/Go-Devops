# Gia tri mac dinh cho moi truong dev.
# Thu tu uu tien: bien moi truong > .env > config.yaml > default trong code.
app:
  name: BackEnd-CP
  env: development
  log_level: debug
  admin_email: admin@cinema.local
  admin_password: admin123

server:
  port: 8080
  read_timeout: 15s
  write_timeout: 15s
  shutdown_timeout: 10s

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  name: cinema
  sslmode: disable
  timezone: Asia/Ho_Chi_Minh
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 1h
  auto_migrate: true

jwt:
  access_ttl: 15m
  refresh_ttl: 168h
  issuer: backend-cp

cors:
  allowed_origins:
    - http://localhost:3000
    - http://localhost:5173
