services:
  postgres:
    image: postgres:16-alpine
    container_name: cp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-cinema}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-cinema}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: cp-rabbitmq
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Fast cache for hot public reads; optional (server runs without it).
  redis:
    image: redis:7-alpine
    container_name: cp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Applies migrations/schema before the backend starts. A password with
  # URL-special characters must be URL-encoded in DATABASE_PASSWORD.
  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations/schema:/migrations:ro
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@postgres:5432/${DATABASE_NAME:-cinema}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: .
    container_name: cp-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # Production by default: the server refuses to start with empty or dev
      # secrets there. For a local stack put APP_ENV=development in .env.
      APP_ENV: ${APP_ENV:-production}
      SERVER_PORT: 8080
      SERVER_TRUSTED_PROXIES: ${SERVER_TRUSTED_PROXIES:-}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-cinema}
      DATABASE_SSLMODE: disable
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      QUEUE_URL: ${QUEUE_URL:-amqp://guest:guest@rabbitmq:5672/}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      PAYMENT_PUBLIC_BASE_URL: ${PAYMENT_PUBLIC_BASE_URL:-http://localhost:8080}
      PAYMENT_PROVIDERS_MOCK_SECRET: ${PAYMENT_PROVIDERS_MOCK_SECRET:-}
      PAYMENT_PROVIDERS_MOCK_ALLOW_IN_PRODUCTION: ${PAYMENT_PROVIDERS_MOCK_ALLOW_IN_PRODUCTION:-false}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://localhost:8080}
    volumes:
      - app_data:/app/data
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  app_data:
