name: cicd

# Setup (Settings -> Secrets and variables -> Actions -> Secrets tab):
#   ENV_FILE : full root .env content (VITE_API_BASE_URL + TEST_* included).
# Deploy builds once, pushes :sha images to the local registry service,
# then pulls and runs them: base + prod overlay, rollback = older sha.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

# Least privilege; deploy re-scopes its own.
permissions:
  contents: read

env:
  COMPOSE_FILE: docker-compose.yml

jobs:
  backend:
    # Odd TEST_* ports dodge the dev stack (5432/5672/6379).
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cinema
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d cinema"
          --health-interval 10s --health-timeout 5s --health-retries 5
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports: ["5673:5672"]
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
    steps:
      - uses: actions/checkout@v4
      - name: Write .env
        run: |
          printf '%s' "${{ secrets.ENV_FILE }}" > .env
          grep -v '^#' .env | grep -v '^$' >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -count=1

  frontend:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Write .env
        run: |
          printf '%s' "${{ secrets.ENV_FILE }}" > .env
          grep -v '^#' .env | grep -v '^$' >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # .env from ENV_FILE verbatim (printf keeps $ and backslashes intact).
      - name: Write .env
        run: |
          printf '%s' "${{ secrets.ENV_FILE }}" > .env
          test -s .env || { echo "::error::Secrets ENV_FILE is empty"; exit 1; }
          grep -q '^VITE_API_BASE_URL=https\?://[^[:space:]]' .env || \
            { echo "::error::ENV_FILE misses a usable VITE_API_BASE_URL"; exit 1; }
      # Self-hosted often lacks buildx; install it explicitly.
      - uses: docker/setup-buildx-action@v3
      - name: Build and push :sha images to local registry
        run: |
          docker compose -f ${{ env.COMPOSE_FILE }} up -d registry
          docker compose -f ${{ env.COMPOSE_FILE }} build backend frontend
          docker tag cinema-backend:local localhost:5000/cinema-backend:${{ github.sha }}
          docker tag cinema-frontend:local localhost:5000/cinema-frontend:${{ github.sha }}
          docker push localhost:5000/cinema-backend:${{ github.sha }}
          docker push localhost:5000/cinema-frontend:${{ github.sha }}
          echo "IMAGE_TAG=${{ github.sha }}" >> "$GITHUB_ENV"
      # Retry: first deploy (migrate + seed) takes longer than a fixed sleep.
      - name: Up and healthcheck
        run: |
          docker compose -f ${{ env.COMPOSE_FILE }} -f docker-compose.prod.yml pull
          docker compose -f ${{ env.COMPOSE_FILE }} -f docker-compose.prod.yml up -d
          set -a; . ./.env; set +a
          for i in $(seq 1 12); do
            curl -fsS http://localhost:${BACKEND_PORT}/healthz && break || sleep 10
          done
