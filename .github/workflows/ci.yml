name: cicd

# Setup (Settings -> Secrets and variables -> Actions -> Secrets tab):
#   ENV_FILE : full root .env content (VITE_API_BASE_URL + TEST_* included).
# Deploy builds once, pushes :sha images to the local registry service,
# then pulls and runs them: base + prod overlay, rollback = older sha.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

# Least privilege; deploy re-scopes its own.
permissions:
  contents: read

env:
  COMPOSE_FILE: docker-compose.yml

jobs:
  backend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      # .env feeds compose interpolation (base file has no defaults).
      - name: Write .env
        run: |
          printf '%s' "${{ secrets.ENV_FILE }}" > .env
          test -s .env || { echo "::error::Secrets ENV_FILE is empty"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - name: Start test dependencies
        run: docker compose -f ${{ env.COMPOSE_FILE }} -f docker-compose.test.yml up -d --wait postgres rabbitmq redis
      - name: Vet and test in container (nonzero exit fails the job)
        run: docker compose -f ${{ env.COMPOSE_FILE }} -f docker-compose.test.yml run --rm --build backend-test
      - name: Verify production build
        run: docker compose -f ${{ env.COMPOSE_FILE }} build backend

  frontend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Write .env
        run: |
          printf '%s' "${{ secrets.ENV_FILE }}" > .env
          test -s .env || { echo "::error::Secrets ENV_FILE is empty"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - name: Lint, typecheck and test in container (nonzero exit fails the job)
        run: docker compose -f ${{ env.COMPOSE_FILE }} -f docker-compose.test.yml run --rm --build frontend-test
      - name: Verify production build
        run: docker compose -f ${{ env.COMPOSE_FILE }} build frontend

  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # .env from ENV_FILE verbatim (printf keeps $ and backslashes intact).
      - name: Write .env
        run: |
          printf '%s' "${{ secrets.ENV_FILE }}" > .env
          test -s .env || { echo "::error::Secrets ENV_FILE is empty"; exit 1; }
          # Relative /api/v1 (same-origin via nginx alias) or absolute URL both work.
          grep -qE '^VITE_API_BASE_URL=(/api/v1|https?://[^[:space:]])' .env || \
            { echo "::error::ENV_FILE misses a usable VITE_API_BASE_URL"; exit 1; }
      # Self-hosted often lacks buildx; install it explicitly.
      - uses: docker/setup-buildx-action@v3
      - name: Build and push :sha images to local registry
        run: |
          docker compose -f ${{ env.COMPOSE_FILE }} up -d registry
          docker compose -f ${{ env.COMPOSE_FILE }} build backend frontend
          docker tag cinema-backend:local localhost:5000/cinema-backend:${{ github.sha }}
          docker tag cinema-frontend:local localhost:5000/cinema-frontend:${{ github.sha }}
          docker push localhost:5000/cinema-backend:${{ github.sha }}
          docker push localhost:5000/cinema-frontend:${{ github.sha }}
          echo "IMAGE_TAG=${{ github.sha }}" >> "$GITHUB_ENV"
      # Retry: first deploy (migrate + seed) takes longer than a fixed sleep.
      - name: Up and healthcheck
        run: |
          docker compose -f ${{ env.COMPOSE_FILE }} -f docker-compose.prod.yml pull
          docker compose -f ${{ env.COMPOSE_FILE }} -f docker-compose.prod.yml up -d
          BACKEND_PORT=$(grep -E '^BACKEND_PORT=' .env | cut -d= -f2 | tr -d '\r')
          for i in $(seq 1 12); do
            curl -fsS http://localhost:${BACKEND_PORT}/healthz && exit 0 || sleep 10
          done
          exit 1
