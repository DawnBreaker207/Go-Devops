# Test stages run the suite via CMD at container start: verify with `run --build`, never bare `build`.
# Deps first: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --wait postgres rabbitmq redis
services:
  backend-test:
    build:
      context: ./backend
      target: test
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      TEST_DB_HOST: postgres
      TEST_DB_PORT: 5432
      TEST_DB_USER: ${DATABASE_USER}
      TEST_DB_PASSWORD: ${DATABASE_PASSWORD}
      QUEUE_TEST_URL: amqp://guest:guest@rabbitmq:5672/
      TEST_REDIS_ADDR: redis:6379

  frontend-test:
    build:
      context: ./frontend
      target: test
